<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block judul %}APIFESTAT{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">APIFESTAT</a>
      <div class="navbar-nav me-auto">
        <a class="nav-link" href="/">Beranda</a>
        <a class="nav-link" href="{% url 'berita:daftar' %}">Berita</a>
        <a class="nav-link" href="/admin/">Admin</a>
        <a class="nav-link" href="{% url 'inventarisasi:pohon' %}">Inventarisasi</a>
      </div>
      <span class="navbar-text text-white small">BPS Kabupaten Malinau</span>
    </div>
  </nav>

  <main class="container py-4">
    {% for pesan in messages %}
      <div class="alert alert-{{ pesan.tags }} alert-dismissible fade show">
        {{ pesan }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
    {% block konten %}{% endblock %}
  </main>

  <footer class="text-center text-muted small py-3">
    Sistem Scraping Fenomena Statistik &middot; Tim Nerwilis
  </footer>
</body>
</html>
